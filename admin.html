<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>LGNDRY.Co Command Center</title>
  <link rel="icon" type="image/png" href="assests/logos/LGNDRY.CO Final.png">
  <link rel="apple-touch-icon" href="assests/logos/LGNDRY.CO Final white.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      --bg: #090908;
      --panel: rgba(22, 21, 19, 0.92);
      --panel-strong: rgba(13, 13, 12, 0.96);
      --panel-soft: rgba(255, 255, 255, 0.045);
      --line: rgba(255, 255, 255, 0.12);
      --line-strong: rgba(255, 255, 255, 0.2);
      --text: #f7f3ec;
      --muted: rgba(247, 243, 236, 0.66);
      --faint: rgba(247, 243, 236, 0.42);
      --inverse: #12110f;
      --accent: #d8c7ad;
      --good: #8aa883;
      --warn: #caa66d;
      --shadow: 0 24px 80px rgba(0, 0, 0, 0.42);
      --radius: 4px;
    }

    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #f5f2ec;
      --panel: rgba(255, 253, 248, 0.92);
      --panel-strong: rgba(255, 255, 255, 0.98);
      --panel-soft: rgba(29, 29, 27, 0.045);
      --line: rgba(29, 29, 27, 0.12);
      --line-strong: rgba(29, 29, 27, 0.2);
      --text: #171614;
      --muted: rgba(23, 22, 20, 0.66);
      --faint: rgba(23, 22, 20, 0.42);
      --inverse: #ffffff;
      --accent: #7a6044;
      --good: #59734f;
      --warn: #9a7133;
      --shadow: 0 24px 80px rgba(54, 45, 31, 0.14);
    }

    * { box-sizing: border-box; }

    html {
      min-height: 100%;
      background: var(--bg);
      font-family: Inter, Arial, sans-serif;
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar,
    .ops-sidebar::-webkit-scrollbar,
    .side-nav::-webkit-scrollbar {
      display: none;
    }

    .ops-sidebar,
    .side-nav {
      scrollbar-width: none;
      -ms-overflow-style: none;
    }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 78% 8%, rgba(216, 199, 173, 0.12), transparent 28%),
        radial-gradient(circle at 12% 12%, rgba(255, 255, 255, 0.06), transparent 22%),
        var(--bg);
      transition: background-color 0.25s ease, color 0.25s ease;
    }

    button, input { font: inherit; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    button { cursor: pointer; }
    a { color: inherit; text-decoration: none; }

    .ops-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: 288px minmax(0, 1fr);
    }

    .ops-sidebar {
      position: sticky;
      top: 0;
      height: 100vh;
      padding: 36px 24px 24px;
      border-right: 1px solid var(--line);
      background: linear-gradient(180deg, var(--panel-strong), rgba(10, 10, 9, 0.86));
      overflow-y: auto;
    }

    :root[data-theme="light"] .ops-sidebar {
      background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(245,242,236,0.9));
    }

    .brand {
      padding: 0 10px 34px;
    }

    .brand__name {
      display: block;
      font-size: 1.45rem;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    .brand__label,
    .eyebrow,
    .nav-item,
    .metric__label,
    .panel__label,
    .theme-toggle,
    .project__status,
    .activity__time {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .brand__label {
      display: block;
      margin-top: 9px;
      color: var(--muted);
    }

    .side-nav {
      display: grid;
      gap: 8px;
    }

    .nav-item {
      position: relative;
      display: grid;
      grid-template-columns: 24px 1fr;
      align-items: center;
      gap: 16px;
      min-height: 50px;
      padding: 0 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      color: var(--muted);
    }

    .nav-item svg,
    .icon-button svg,
    .theme-toggle svg,
    .profile > svg,
    .metric__icon svg,
    .activity__icon svg {
      width: 20px;
      height: 20px;
      stroke-width: 1.45;
    }

    .nav-item--active,
    .nav-item:hover {
      background: var(--panel-soft);
      border-color: var(--line);
      color: var(--text);
    }

    .nav-item--active::before {
      content: "";
      position: absolute;
      left: -24px;
      top: 10px;
      bottom: 10px;
      width: 3px;
      background: var(--text);
    }

    .sidebar-card {
      margin-top: 72px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      background: var(--panel);
    }

    .sidebar-card img {
      display: block;
      width: 100%;
      aspect-ratio: 1.18 / 1;
      object-fit: cover;
      filter: grayscale(0.8) contrast(1.06);
    }

    .sidebar-card__body { padding: 22px 22px 24px; }
    .sidebar-card__body h3 {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.5rem;
      font-weight: 400;
      line-height: 1.03;
    }
    .sidebar-card__body p { margin: 14px 0 0; color: var(--muted); font-size: 0.78rem; }

    .ops-main {
      min-width: 0;
      padding: 30px clamp(22px, 3vw, 46px) 40px;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(240px, 1fr) minmax(240px, 340px) auto auto minmax(240px, auto);
      align-items: center;
      gap: 28px;
      margin-bottom: 28px;
    }

    .welcome h1 {
      margin: 0;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 0.01em;
    }
    .welcome p { margin: 8px 0 0; color: var(--muted); font-size: 0.84rem; }

    .search {
      position: relative;
    }

    .search input {
      width: 100%;
      height: 48px;
      padding: 0 48px 0 18px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius);
      background: transparent;
      color: var(--text);
      outline: none;
    }

    .search svg {
      position: absolute;
      right: 16px;
      top: 50%;
      width: 20px;
      height: 20px;
      transform: translateY(-50%);
      color: var(--muted);
    }

    .icon-button,
    .theme-toggle {
      height: 48px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .icon-button { width: 48px; }
    .theme-toggle { gap: 10px; padding: 0 16px; }

    .profile {
      justify-self: end;
      display: grid;
      grid-template-columns: 56px auto 18px;
      align-items: center;
      gap: 14px;
      padding-left: 12px;
      border-left: 1px solid var(--line);
      background: none;
      font: inherit;
      color: inherit;
      cursor: pointer;
      text-align: left;
    }

    .profile img {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      object-fit: cover;
      filter: grayscale(0.75);
      border: 1px solid var(--line-strong);
    }

    .profile strong { display: block; font-size: 0.88rem; font-weight: 500; }
    .profile span { display: block; margin-top: 5px; color: var(--muted); font-size: 0.76rem; }

    .popover-anchor { position: relative; }

    .popover {
      position: absolute;
      top: calc(100% + 12px);
      right: 0;
      min-width: 260px;
      max-width: 320px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      padding: 8px;
      z-index: 40;
      display: none;
    }

    .popover.is-open { display: block; }

    .popover .activity-list { max-height: 280px; overflow-y: auto; }
    .popover .activity:first-child { padding-top: 0; }
    .popover .activity:last-child { border-bottom: 0; }

    .popover-title {
      display: block;
      padding: 8px 10px 10px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .popover-item {
      display: block;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 10px;
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .popover-item:hover { background: var(--line); }

    .global-search__results {
      position: absolute;
      top: calc(100% + 10px);
      left: 0;
      right: 0;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.18);
      padding: 8px;
      z-index: 40;
      display: none;
      max-height: 360px;
      overflow-y: auto;
    }

    .global-search__results.is-open { display: block; }

    .global-search__item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: none;
      border: none;
      padding: 10px;
      border-radius: 8px;
      color: var(--text);
      font: inherit;
      font-size: 0.86rem;
      cursor: pointer;
    }

    .global-search__item:hover { background: var(--line); }

    .global-search__type {
      font-size: 0.66rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      white-space: nowrap;
    }

    .global-search__label {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .global-search__empty {
      margin: 0;
      padding: 10px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .auth-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        linear-gradient(180deg, rgba(9, 9, 8, 0.5), rgba(9, 9, 8, 0.88)),
        url("assests/images/founder-2.jpeg") center 30% / cover no-repeat;
    }

    .auth-card {
      width: 100%;
      max-width: 360px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, rgba(22, 21, 19, 0.86), rgba(22, 21, 19, 0.78));
      backdrop-filter: blur(6px);
      box-shadow: var(--shadow);
      padding: 40px 34px;
      display: grid;
      gap: 16px;
    }

    .auth-card__brand { font-size: 1.3rem; font-weight: 500; letter-spacing: -0.03em; }
    .auth-card__label {
      margin-top: -10px;
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .auth-card h1 {
      margin: 6px 0 4px;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 1.7rem;
      font-weight: 400;
    }
    .auth-card__error {
      min-height: 16px;
      margin: 0;
      color: #c07870;
      font-size: 0.78rem;
    }

    .loading-gate {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .loading-gate__mark {
      display: grid;
      justify-items: center;
      gap: 18px;
    }

    .loading-gate__spinner {
      width: 30px;
      height: 30px;
      border-radius: 999px;
      border: 1px solid var(--line);
      border-top-color: var(--text);
      animation: loading-gate-spin 0.8s linear infinite;
    }

    .loading-gate__mark p {
      margin: 0;
      font-size: 0.72rem;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
    }

    @keyframes loading-gate-spin {
      to { transform: rotate(360deg); }
    }

    .dashboard-grid {
      display: grid;
      gap: 14px;
      margin-top: 0;
    }

    .metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(160px, 1fr));
      gap: 12px;
    }

    .metric,
    .panel,
    .focus-strip {
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: linear-gradient(135deg, var(--panel), rgba(255,255,255,0.025));
      box-shadow: 0 10px 32px rgba(0, 0, 0, 0.08);
    }

    .metric {
      min-height: 142px;
      padding: 22px;
      display: grid;
      align-content: space-between;
      gap: 18px;
    }

    .metric__top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
    }

    .metric__label,
    .panel__label { color: var(--text); }

    .metric__icon,
    .activity__icon {
      width: 44px;
      height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line-strong);
      border-radius: 50%;
      color: var(--muted);
      flex: 0 0 auto;
    }

    .metric__value {
      display: block;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2.35rem, 3vw, 3.2rem);
      line-height: 0.9;
      font-weight: 400;
    }

    .metric__link,
    .panel__link {
      display: flex;
      justify-content: space-between;
      gap: 14px;
      color: var(--muted);
      font-size: 0.78rem;
    }

    .panels {
      display: grid;
      grid-template-columns: 1.25fr 0.8fr 1.05fr;
      gap: 14px;
    }

    .panel { padding: 24px 28px; min-width: 0; }
    .panel__header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .project-list,
    .booking-list,
    .activity-list { display: grid; gap: 0; }

    .project {
      display: grid;
      grid-template-columns: 108px minmax(130px, 1fr) 100px 46px 78px;
      gap: 20px;
      align-items: center;
      min-height: 72px;
      padding: 11px 0;
      border-bottom: 1px solid var(--line);
    }

    .project img {
      width: 108px;
      height: 60px;
      object-fit: cover;
      filter: grayscale(0.75) contrast(1.05);
    }

    .project h3,
    .booking h3,
    .activity p { margin: 0; font-size: 0.88rem; font-weight: 500; }
    .project p,
    .booking p { margin: 6px 0 0; color: var(--muted); font-size: 0.74rem; }
    .project__status { color: var(--muted); letter-spacing: 0.04em; text-transform: none; font-size: 0.72rem; }
    .dot { display: inline-block; width: 5px; height: 5px; border-radius: 50%; margin-right: 8px; background: var(--good); vertical-align: middle; }
    .dot--warn { background: var(--warn); }
    .project__progress { color: var(--text); font-size: 0.75rem; }
    .bar { height: 1px; background: var(--line); position: relative; }
    .bar span { position: absolute; left: 0; top: 0; bottom: 0; width: var(--value); background: var(--text); }

    .booking {
      display: grid;
      grid-template-columns: 54px 1fr;
      gap: 22px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .booking__date {
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: 2rem;
      line-height: 0.9;
      text-align: center;
    }
    .booking__date span {
      display: block;
      margin-top: 8px;
      font-family: Inter, Arial, sans-serif;
      font-size: 0.62rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      color: var(--muted);
    }

    .activity {
      display: grid;
      grid-template-columns: 44px 1fr auto;
      gap: 18px;
      align-items: center;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }
    .activity__time { color: var(--muted); letter-spacing: 0.04em; text-transform: none; font-size: 0.72rem; }

    .panel__footer { margin-top: 22px; }

    .focus-strip {
      min-height: 164px;
      display: grid;
      grid-template-columns: 0.72fr 1.12fr 0.45fr;
      overflow: hidden;
    }

    .focus-strip img {
      width: 100%;
      height: 100%;
      min-height: 164px;
      object-fit: cover;
      filter: grayscale(0.86) contrast(1.04);
    }

    .focus-strip__quote {
      display: flex;
      align-items: center;
      padding: 30px clamp(26px, 4vw, 62px);
    }

    .focus-strip__quote p {
      margin: 0;
      font-family: "Cormorant Garamond", Georgia, serif;
      font-size: clamp(2rem, 3vw, 3.3rem);
      line-height: 0.98;
    }

    .focus-strip__action {
      display: grid;
      align-content: center;
      gap: 14px;
      padding: 28px;
    }
    .focus-strip__action p { margin: 0; color: var(--muted); font-size: 0.8rem; line-height: 1.6; }

    @media (max-width: 1280px) {
      .ops-shell { grid-template-columns: 236px minmax(0, 1fr); }
      .metrics { grid-template-columns: repeat(3, minmax(160px, 1fr)); }
      .panels { grid-template-columns: 1fr; }
      .project { grid-template-columns: 98px minmax(120px, 1fr) 90px 42px 68px; }
    }

    @media (max-width: 980px) {
      .ops-shell { grid-template-columns: 1fr; }
      .ops-sidebar {
        position: static;
        height: auto;
        padding: 24px;
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .side-nav { grid-template-columns: repeat(5, minmax(130px, 1fr)); overflow-x: auto; }
      .sidebar-card { display: none; }
      .topbar { grid-template-columns: 1fr auto auto auto auto; }
      .search { grid-column: 1 / -1; }
      .profile {
        justify-self: end;
        border-left: 0;
        padding-left: 0;
      }
      .metrics { grid-template-columns: repeat(2, minmax(150px, 1fr)); }
      .focus-strip { grid-template-columns: 1fr; }
      .focus-strip img { height: 210px; }
    }

    @media (max-width: 640px) {
      .ops-main { padding: 20px 14px 28px; }
      .ops-sidebar { padding: 22px 14px; }
      .brand { padding-inline: 4px; }
      .side-nav { grid-template-columns: repeat(10, 148px); }
      .topbar { gap: 14px; }
      .theme-toggle span { display: none; }
      .metrics { grid-template-columns: 1fr; }
      .metric { min-height: 118px; }
      .panel { padding: 22px 18px; }
      .project { grid-template-columns: 82px 1fr; gap: 14px; }
      .project__status, .project__progress, .bar { display: none; }
      .activity { grid-template-columns: 38px 1fr; }
      .activity__time { grid-column: 2; }
      .focus-strip__quote, .focus-strip__action { padding: 24px; }
    }
  </style>

      <button class="primary-btn" type="submit" data-auth-submit>Sign In</button>
      <p class="auth-card__error" data-auth-error role="alert" aria-live="polite"></p>
